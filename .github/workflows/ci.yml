name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Placeholder frontend for go:embed
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - run: go vet ./...
      # -short skips the end-to-end tests that start real processes
      # (testsupport.E2E); run them locally with a plain `go test ./...`.
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -short -race ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -short ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
